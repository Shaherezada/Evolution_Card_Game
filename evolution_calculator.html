<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <title>Эволюция - Калькулятор</title>
    <link rel="stylesheet" href="rightgames_style.css">
    <script type="text/javascript" src="script.js"></script>
</head>

<body>
   <div class="evolution-container">

        <!-- Заголовок -->
        <h2 class="calc-title">Калькулятор</h2>

        <!-- Поле вывода -->
        <div id="evolution-display" class="result">
            0
        </div>

        <!-- Блок с кнопками -->
        <div>
            <!-- Горизонтальный ряд -->
            <div>
                <button id="action_extinction"    class="my-btn utility_trait">C</button>
                <button id="action_mutation"      class="my-btn utility_trait">+/-</button>
                <button id="action_adaptation"    class="my-btn utility_trait">%</button>
                <button id="op_territory_div"     class="my-btn primary_trait">/</button>
            </div>

            <div>
                <button id="btn_digit_7"          class="my-btn">7</button>
                <button id="btn_digit_8"          class="my-btn">8</button>
                <button id="btn_digit_9"          class="my-btn">9</button>
                <button id="op_reproduction_mult" class="my-btn primary_trait">x</button>
            </div>

            <div>
                <button id="btn_digit_4"          class="my-btn">4</button>
                <button id="btn_digit_5"          class="my-btn">5</button>
                <button id="btn_digit_6"          class="my-btn">6</button>
                <button id="btn_op_minus"         class="my-btn primary_trait">-</button>
            </div>

            <div>
                <button id="btn_digit_1"          class="my-btn">1</button>
                <button id="btn_digit_2"          class="my-btn">2</button>
                <button id="btn_digit_3"          class="my-btn">3</button>
                <button id="op_symbiosis_plus"    class="my-btn primary_trait">+</button>
            </div>

            <div>
                <button id="btn_digit_0"          class="my-btn">0</button>
                <button id="btn_digit_dot"        class="my-btn">.</button>
                <button id="action_calculate_score" class="my-btn primary_trait execute">=</button>
            </div>

        </div>
    </div>
</body>
</html>
