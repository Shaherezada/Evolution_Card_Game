<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <title>Эволюция - Калькулятор</title>
    <link rel="stylesheet" href="rightgames_style.css">
    <script type="text/javascript" src="evolution_logic.js"></script>
</head>

<body>
   <div class="evolution-container">

        <!-- Заголовок -->
        <h2 class="calc-title">Калькулятор</h2>

        <!-- Поле вывода -->
        <div id="evolution-display" class="result">
            0
        </div>

        <!-- Блок с кнопками -->
        <div>
            <!-- Горизонтальный ряд -->
            <div>
                <button id="action_extinction"       class="my-btn utility_trait">C</button>

                <!-- Кнопка стирания введённой цифры (backspace) вместо +/- -->
                <button id="action_regression"       class="my-btn utility_trait">del</button>

                <button id="action_calculate_evolution_score" class="my-btn icon-btn">
                    <img src="assets/button-icon.png" alt="Score">
                </button>

                <button id="op_territory_div"        class="my-btn primary_trait">/</button>
            </div>

            <div>
                <button id="genome_val_7"            class="my-btn">7</button>
                <button id="genome_val_8"            class="my-btn">8</button>
                <button id="genome_val_9"            class="my-btn">9</button>
                <button id="op_reproduction_mult"    class="my-btn primary_trait">x</button>
            </div>

            <div>
                <button id="genome_val_4"            class="my-btn">4</button>
                <button id="genome_val_5"            class="my-btn">5</button>
                <button id="genome_val_6"            class="my-btn">6</button>
                <button id="op_predation_minus"      class="my-btn primary_trait">-</button>
            </div>

            <div>
                <button id="genome_val_1"            class="my-btn">1</button>
                <button id="genome_val_2"            class="my-btn">2</button>
                <button id="genome_val_3"            class="my-btn">3</button>
                <button id="op_symbiosis_plus"       class="my-btn primary_trait">+</button>
            </div>

            <div>
                <button id="genome_val_0"            class="my-btn">0</button>
                <button id="genome_val_dot"          class="my-btn">.</button>
                <button id="action_calculate_result" class="my-btn primary_trait execute">=</button>
            </div>

        </div>
    </div>
</body>
</html>
