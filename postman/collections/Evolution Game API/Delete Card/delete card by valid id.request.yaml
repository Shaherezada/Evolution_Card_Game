$kind: http-request
name: Delete card by valid ID
method: DELETE
url: '{{baseUrl}}/cards/{{createdCardId}}'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      
      pm.test("Response has the deleted card's id equal to createdCardId (parsed as number)", function () {
        const createdCardId = parseInt(pm.collectionVariables.get("createdCardId"));
        pm.expect(pm.response.json().id).to.equal(createdCardId);
      });
