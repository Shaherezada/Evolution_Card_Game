$kind: http-request
name: Delete card with invalid ID returns 400
method: DELETE
url: '{{baseUrl}}/cards/abc'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function () {
        pm.response.to.have.status(400);
      });
      
      pm.test("Response body has an 'error' field", function () {
        pm.expect(pm.response.json()).to.have.property('error');
      });
