$kind: http-request
name: Filter with no match returns empty array
method: GET
url: '{{baseUrl}}/cards?name=ZZZNOMATCH999'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      
      pm.test("Response is an empty array", function () {
        pm.expect(pm.response.json()).to.be.an('array').that.is.empty;
      });
