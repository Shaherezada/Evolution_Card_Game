$kind: http-request
name: Get all cards
method: GET
url: '{{baseUrl}}/cards'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      
      pm.test("Response is an array", function () {
        pm.expect(pm.response.json()).to.be.an('array');
      });
      
      pm.test("Each item has fields: id, name, nameEn, type, effect", function () {
        const cards = pm.response.json();
        cards.forEach(card => {
          pm.expect(card).to.have.property('id');
          pm.expect(card).to.have.property('name');
          pm.expect(card).to.have.property('nameEn');
          pm.expect(card).to.have.property('type');
          pm.expect(card).to.have.property('effect');
        });
      });
