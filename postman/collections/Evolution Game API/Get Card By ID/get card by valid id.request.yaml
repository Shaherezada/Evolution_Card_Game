$kind: http-request
name: Get card by valid ID
method: GET
url: '{{baseUrl}}/cards/1'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      
      pm.test("Response has id equal to 1", function () {
        pm.expect(pm.response.json().id).to.equal(1);
      });
      
      pm.test("Response has fields: name, nameEn, type, effect", function () {
        const card = pm.response.json();
        pm.expect(card).to.have.property('name');
        pm.expect(card).to.have.property('nameEn');
        pm.expect(card).to.have.property('type');
        pm.expect(card).to.have.property('effect');
      });
