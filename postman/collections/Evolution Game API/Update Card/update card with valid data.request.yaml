$kind: http-request
name: Update card with valid data
method: PATCH
url: '{{baseUrl}}/cards/{{createdCardId}}'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "foodCost": 2
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      
      pm.test("Response id equals the value of createdCardId collection variable (parsed as number)", function () {
        const createdCardId = parseInt(pm.collectionVariables.get("createdCardId"));
        pm.expect(pm.response.json().id).to.equal(createdCardId);
      });
      
      pm.test("Response foodCost equals 2", function () {
        pm.expect(pm.response.json().foodCost).to.equal(2);
      });
