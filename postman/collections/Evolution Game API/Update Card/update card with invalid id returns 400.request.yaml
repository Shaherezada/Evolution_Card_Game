$kind: http-request
name: Update card with invalid ID returns 400
method: PATCH
url: '{{baseUrl}}/cards/abc'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "foodCost": 3
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function () {
        pm.response.to.have.status(400);
      });
      
      pm.test("Response body has an 'error' field", function () {
        pm.expect(pm.response.json()).to.have.property('error');
      });
